<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Der Stuhleck-Gipfel als 3D-Szene: Orthofoto auf dem Laserscan-Gelände mit dem Yagi-Stack auf Rotor 1 (Grundstellung Deutschland), dem Quad-Stack auf Rotor 2, dem Auto, der Bergstation der Steinbachalmbahn und dem Tabu-Sektor Richtung Seilbahn.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://www.longpath.at/stuhleck-3d">

<style>
:root{--bg:#0c0c0e;--panel:rgba(20,20,24,.86);--t1:#dcdce1;--t2:#c4c4ca;--t3:#a6a6ac;--t5:#7e7e85;--t6:#58585e;--amb:#d8a55f;--ok:#6fa384;--warn:#a8853f;--border:#2c2c31;--ff:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif}
html,body{height:100%;margin:0;background:var(--bg);color:var(--t1);font-family:var(--ff);font-size:13px;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;left:16px;top:calc(16px + env(safe-area-inset-top,0px));width:min(320px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:14px 16px;backdrop-filter:blur(6px);box-sizing:border-box}
#hud .k{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--t5);margin:0 0 6px}
#hud h1{font-size:19px;font-weight:600;margin:0 0 8px;line-height:1.2;text-wrap:balance}
#hud p{margin:0;color:var(--t3);line-height:1.5}
#hud .now{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
#hud .now b{color:var(--amb);font-variant-numeric:tabular-nums;font-size:15px}
#bar{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#bar button{font:inherit;font-size:12.5px;color:var(--t1);background:var(--panel);border:1px solid var(--border);border-radius:5px;padding:8px 12px;cursor:pointer;backdrop-filter:blur(6px)}
#bar button:hover{border-color:var(--t5)}
#bar button:focus-visible{outline:2px solid var(--amb);outline-offset:1px}
#bar button[aria-pressed="true"]{border-color:var(--amb);color:var(--amb)}
#bar .sp{flex:1}
#hud .tabu{color:#e06a5a}
#bar .ctl{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:8px 12px;backdrop-filter:blur(6px)}
#bar .ctl label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t2)}
#bar .ctl .n{width:74px;color:var(--t3)}
#bar .ctl label.qs .n{color:#d8a55f}#bar .ctl label.ys .n{color:#6fa384}
#bar .ctl{flex-direction:column;align-items:flex-start}
#bar .ctl input[type=range]{width:120px;accent-color:var(--amb)}
#bar .ctl input[type=number]{width:52px;font:inherit;font-size:12.5px;color:var(--t1);background:#0c0c0e;border:1px solid var(--border);border-radius:4px;padding:3px 4px;text-align:right;font-variant-numeric:tabular-nums}
#bar .ctl .u{color:var(--t5)}
#bar .ctl .presets{display:flex;gap:6px;flex-wrap:wrap}
#bar .ctl .presets button{padding:5px 8px;font-size:11.5px}
#bar .ctl .presets .pl{font-size:11px;color:var(--t5);margin-left:6px}
@media (max-width:640px){#bar .ctl input[type=range]{width:90px}#bar .ctl .n{width:64px}}
#bar .src{color:var(--t6);font-size:10.5px;line-height:1.4;text-align:right;max-width:46vw}
#hud button.min{position:absolute;right:10px;top:10px;font:inherit;font-size:11px;color:var(--t5);background:none;border:1px solid var(--border);border-radius:4px;padding:2px 7px;cursor:pointer}
#hud.min > :not(button){display:none}
#hud.min{width:auto;padding:10px 60px 10px 16px}
#hud.min::before{content:"Stuhleck 3D";font-weight:600}
@media (max-width:640px){#hud{font-size:12px}#hud h1{font-size:16px}#bar .src{display:none}}
@media (max-height:560px){#hud{width:min(260px,calc(100vw - 32px));padding:10px 12px}#hud h1{font-size:14px;margin-bottom:4px}#hud p:not(.now):not(.k){display:none}#hud .now{margin-top:6px;padding-top:6px}}
</style>

// Zählung im Hauptstrahl und Städte
function inSec(b,lo,hi){ return ((b-lo)%360+360)%360<=((hi-lo)%360+360)%360; }
function tabuHit(key,h){ const t=key==='ys'?SITE.tabuY:SITE.tabuQ; const lo=t[0]-2, hi=t[1]+2; return inSec(h,lo,hi)||inSec(h,lo+180,hi+180); }
function lobeCount(a,h){ const c=a.cnt; let n=0, dl=0; const by=new Array(CNT.ctys.length).fill(0); const half=a.hp/2; for(let k=0;k<360;k++){ let d=((k-h+540)%360)-180; if(Math.abs(d)<=half){ n+=c[0][k]; dl+=c[1][k]; for(let j=0;j<by.length;j++) by[j]+=c[2][k][j]; } } return [n,dl,by]; }
function lobeCountries(by){ return by.map((v,j)=>[CNT.ctys[j],v]).filter(([n,v])=>v>0&&n!=='andere').sort((x,y)=>y[1]-x[1]).slice(0,6).map(([n,v])=>n+' '+v).join(', '); }
function lobeCities(a,h){ return CNT.cities.filter(([n,b])=>Math.abs(((b-h+540)%360)-180)<=a.hp/2).map(([n])=>n).slice(0,6).join(', '); }
const HD={...SITE.start}; const nowEl=document.getElementById('now');
function apply(key,h,fromInput){ h=((Math.round(h)%360)+360)%360; HD[key]=h; const a=ANT[key];
  a.obj.rotation.y=-h*Math.PI/180; a.fan.setHeading(h);
  if(a.lab){ grp.remove(a.lab); a.lab.material.map.dispose(); a.lab.material.dispose(); }
  const [n,dl,by]=lobeCount(a,h); const bad=tabuHit(key,h); a.lab=edge(a.mx,a.my,h,a.name+' '+h+'° · '+(bad?'TABU':n+' Stationen'),22,bad?'#f0a090':a.col,a.r);
  document.querySelectorAll('#ctl input[data-a="'+key+'"]').forEach(i=>{ if(i!==fromInput) i.value=h; });
  nowEl.innerHTML=['ys','qs'].map(k=>{ const b=ANT[k]; const [nn,dd,by]=lobeCount(b,HD[k]); const bad=tabuHit(k,HD[k]); return `<span style="color:${b.col}">${b.name}</span> <b>${HD[k]}°</b> `+(bad?`<span class="tabu">im Tabu — Richtung Seilbahn, hier wird nicht gesendet</span>`:`${nn} Stationen — ${lobeCountries(by)}<br><span style="color:var(--t5)">${lobeCities(b,HD[k])}</span>`); }).join('<br>'); }
document.querySelectorAll('#ctl input[data-a]').forEach(i=>{ i.addEventListener('input',()=>apply(i.dataset.a,+i.value,i)); });
document.querySelectorAll('#ctl button[data-q]').forEach(b=>b.addEventListener('click',()=>apply('qs',+b.dataset.q)));

function flyTo(v){ if(reduced){ camera.position.copy(v.p); controls.target.copy(v.t); return; } fly={p0:camera.position.clone(),t0:controls.target.clone(),p1:v.p,t1:v.t,s:performance.now()}; }
const hudEl=document.getElementById('hud'), miniBtn=document.getElementById('mini'); let hudWasOpen=true;
viewBtn.addEventListener('click',()=>{ stView=!stView; viewBtn.setAttribute('aria-pressed',String(stView)); flyTo(stView?VIEW_S:VIEW_M);

const autoBtn=document.getElementById('auto');
function setAuto(v){ autoOn=v && !reduced; controls.autoRotate=autoOn; autoBtn.setAttribute('aria-pressed',String(autoOn)); autoBtn.textContent=autoOn?'Stopp':'Drehen'; autoBtn.title=autoOn?'Drehung anhalten':'Ansicht langsam drehen lassen'; }
setAuto(false);

controls.addEventListener('start',()=>{ if(autoOn) setAuto(false); });

  if(fly){ const k=Math.min(1,(now-fly.s)/2200); const e=k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2; camera.position.lerpVectors(fly.p0,fly.p1,e); controls.target.lerpVectors(fly.t0,fly.t1,e); if(k>=1)fly=null; }
